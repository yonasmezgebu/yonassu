# =====================================================
# SUTANA EMS - DOCKER COMPOSE
# Complete stack: Backend + PostgreSQL + Redis
# =====================================================

version: '3.8'

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: sutana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sutana_user
      POSTGRES_PASSWORD: sutana_pass
      POSTGRES_DB: sutana_ems_dev
      # The application stores timezone-naive `timestamp` columns and pins the
      # session to Africa/Addis_Ababa (see src/config/database.js), so the
      # server default has to agree or ad-hoc psql sessions disagree with the app.
      TZ: Africa/Addis_Ababa
      PGTZ: Africa/Addis_Ababa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sutana-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutana_user -d sutana_ems_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Redis Cache & Session Store
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: sutana-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sutana-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Backend API
  # =====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sutana-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sutana_user
      DB_PASSWORD: sutana_pass
      DB_NAME: sutana_ems_dev
      DB_TIMEZONE: Africa/Addis_Ababa
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_pass
      JWT_SECRET: dev_jwt_secret_key_do_not_use_in_production_12345
      JWT_REFRESH_SECRET: dev_refresh_secret_key_do_not_use_in_production_67890
      ENCRYPTION_KEY: dev_32_char_encryption_key_123456
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    networks:
      - sutana-network
    command: npm run dev

  # =====================================================
  # pgAdmin (Database Management - Development Only)
  # =====================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sutana-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sutana.local
      PGADMIN_DEFAULT_PASSWORD: sutana_pass
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - sutana-network
    profiles:
      - dev

  # =====================================================
  # Redis Commander (Redis Management - Development Only)
  # =====================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sutana-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_pass
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - sutana-network
    profiles:
      - dev

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =====================================================
# Networks
# =====================================================
networks:
  sutana-network:
    driver: bridge
    name: sutana-network
