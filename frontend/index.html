<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sutana EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Initial page load spinner ─────────────────────────────── */
    #app-boot-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      animation: boot-spin 0.75s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Spinner shown while JS bundle loads, hidden once React mounts -->
  <div id="app-boot-screen" aria-hidden="true">
    <div class="boot-spinner"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
